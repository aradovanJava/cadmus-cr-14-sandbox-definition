---
# CADMUS-CR-14 · Secure Coding Java (BTCMP-02) · sandbox provisioning
#
#   sq1   VM3  SonarQube (SAST) in Docker   Ubuntu 24.04
#   owz1  VM2  OWASP ZAP (DAST) in Docker   Ubuntu 24.04
#   sc1   VM1  developer workstation        Windows 11, RDP
#
# The Linux hosts go first: they are quick, and it lets SonarQube finish its
# first start-up while the Windows workstation is still being provisioned.
# All tunables are in group_vars/all.yml.

# =============================================================================
#  SQ1 + OWZ1 - base system, trainee account, Docker Engine
# =============================================================================
- name: Docker hosts (SQ1, OWZ1) - base system, trainee account, Docker
  hosts:
    - sq1
    - owz1
  become: true

  pre_tasks:
    - name: Stop unattended upgrades so they cannot hold the apt lock
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - unattended-upgrades
        - apt-daily.timer
        - apt-daily-upgrade.timer
      failed_when: false

    - name: Wait for any apt/dpkg run started at boot to finish
      ansible.builtin.shell: |
        for i in $(seq 1 120); do
          fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/lib/dpkg/lock >/dev/null 2>&1 || exit 0
          sleep 5
        done
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

  roles:
    - role: ansible-role-user-access
      user_access_username: "{{ cr14_trainee_user }}"
      user_access_password: "{{ cr14_trainee_password }}"
      user_access_sudo: false

  tasks:
    - name: Install Docker Engine and Compose v2 from the Ubuntu archive
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - curl
        state: present
        update_cache: true
      register: cr14_apt
      retries: 3
      delay: 20
      until: cr14_apt is succeeded

    - name: Start Docker and enable it at boot
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Let the trainee run docker without sudo
      ansible.builtin.user:
        name: "{{ cr14_trainee_user }}"
        groups: docker
        append: true

    - name: Resolve the lab machines by name
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} CADMUS-CR-14 lab hosts"
        block: |
          {{ cr14_ip_sc1 }} sc1
          {{ cr14_ip_sq1 }} sq1
          {{ cr14_ip_owz1 }} owz1

    - name: Compose project directory /opt/cr14
      ansible.builtin.file:
        path: /opt/cr14
        state: directory
        owner: root
        group: docker
        mode: "0775"

# =============================================================================
#  SQ1 (VM3) - SonarQube Community Build
# =============================================================================
- name: SQ1 (VM3) - SonarQube Community Build
  hosts: sq1
  become: true

  tasks:
    - name: Kernel settings required by SonarQube's embedded Elasticsearch
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-sonarqube.conf
        content: |
          vm.max_map_count=524288
          fs.file-max=131072
        mode: "0644"
      register: cr14_sysctl

    - name: Apply kernel settings
      ansible.builtin.command: sysctl --system
      when: cr14_sysctl is changed
      changed_when: true

    - name: Pull SonarQube (first registry that answers is used)
      ansible.builtin.shell: |
        for img in {{ cr14_sonarqube_images | join(' ') }}; do
          for attempt in 1 2 3; do
            if docker pull --quiet "$img" >/dev/null 2>&1; then
              echo "$img"
              exit 0
            fi
            sleep 15
          done
        done
        echo "could not pull any of: {{ cr14_sonarqube_images | join(' ') }}" >&2
        exit 1
      args:
        executable: /bin/bash
      register: cr14_sq_pull
      changed_when: false

    - name: Write /opt/cr14/docker-compose.yml
      ansible.builtin.template:
        src: sq1-docker-compose.yml.j2
        dest: /opt/cr14/docker-compose.yml
        mode: "0644"
      vars:
        cr14_sonarqube_image: "{{ cr14_sq_pull.stdout | trim }}"

    - name: Start SonarQube, or only create the container (cr14_autostart_tools)
      ansible.builtin.command:
        cmd: "docker compose {{ 'up -d' if cr14_autostart_tools else 'create' }}"
        chdir: /opt/cr14
      changed_when: true

    - name: Wait until SonarQube reports UP (first start takes a few minutes)
      ansible.builtin.uri:
        url: http://127.0.0.1:9000/api/system/status
        return_content: true
      register: cr14_sq_status
      until: cr14_sq_status.json is defined and cr14_sq_status.json.status == 'UP'
      retries: 60
      delay: 10
      when: cr14_autostart_tools

# =============================================================================
#  OWZ1 (VM2) - OWASP ZAP, desktop UI served through Webswing
# =============================================================================
- name: OWZ1 (VM2) - OWASP ZAP
  hosts: owz1
  become: true

  tasks:
    - name: Pull the ZAP image
      ansible.builtin.command: docker pull --quiet {{ cr14_zap_image }}
      register: cr14_zap_pull
      retries: 3
      delay: 15
      until: cr14_zap_pull is succeeded
      changed_when: false

    - name: ZAP working directory (the container runs as uid 1000)
      ansible.builtin.file:
        path: /opt/cr14/zap-wrk
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0775"

    - name: Write /opt/cr14/docker-compose.yml
      ansible.builtin.template:
        src: owz1-docker-compose.yml.j2
        dest: /opt/cr14/docker-compose.yml
        mode: "0644"

    - name: Start ZAP, or only create the container (cr14_autostart_tools)
      ansible.builtin.command:
        cmd: "docker compose {{ 'up -d' if cr14_autostart_tools else 'create' }}"
        chdir: /opt/cr14
      changed_when: true

    - name: Wait for the ZAP web UI
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/zap/
        status_code: [200, 302]
      register: cr14_zap_ui
      until: cr14_zap_ui is succeeded
      retries: 30
      delay: 10
      when: cr14_autostart_tools

# =============================================================================
#  SC1 (VM1) - Windows 11 developer workstation
# =============================================================================
- name: SC1 (VM1) - Windows 11 developer workstation
  hosts: sc1
  gather_facts: false

  pre_tasks:
    - name: Wait until SC1 accepts management connections
      ansible.builtin.wait_for_connection:
        delay: 0
        sleep: 10
        timeout: 1800

    - name: Make sure OpenSSH Server exists (the user-access role configures it)
      ansible.windows.win_shell: |
        if (Get-Service sshd -ErrorAction SilentlyContinue) { 'present'; exit 0 }
        Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
        Set-Service sshd -StartupType Automatic
        Start-Service sshd
        'installed'
      register: cr14_sshd
      changed_when: "'installed' in cr14_sshd.stdout"
      failed_when: false

  roles:
    - role: ansible-role-user-access-windows
      user_access_username: "{{ cr14_trainee_user }}"
      user_access_password: "{{ cr14_trainee_password }}"
      user_access_rdp: true
      user_access_admin: true

  tasks:
    # --- account and folders --------------------------------------------------
    - name: Keep the trainee password from expiring during the course
      ansible.windows.win_user:
        name: "{{ cr14_trainee_user }}"
        password_never_expires: true

    - name: Folders for tools, lab material and installers
      ansible.windows.win_file:
        path: "{{ item }}"
        state: directory
      loop:
        - C:\Tools\bin
        - "{{ cr14_lab_dir }}"
        - C:\Windows\Temp\cr14

    - name: Put C:\Tools\bin on the machine PATH
      ansible.windows.win_path:
        elements: C:\Tools\bin
        scope: machine
        state: present

    # --- software stack (framework section 2.1, VM1) -------------------------
    - name: Chocolatey packages
      chocolatey.chocolatey.win_chocolatey:
        name: "{{ item }}"
        state: present
      loop: "{{ cr14_choco_packages }}"
      register: cr14_choco
      retries: 3
      delay: 30
      until: cr14_choco is succeeded

    - name: Download Oracle JDK 25 (latest update, NFTC licence)
      ansible.windows.win_get_url:
        url: "{{ cr14_jdk_msi_url }}"
        dest: C:\Windows\Temp\cr14\jdk-25_windows-x64_bin.msi
      register: cr14_jdk_dl
      retries: 3
      delay: 20
      until: cr14_jdk_dl is succeeded

    - name: Install JDK 25 and set JAVA_HOME
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $jdk = Get-ChildItem 'C:\Program Files\Java' -Directory -Filter 'jdk-25*' -ErrorAction SilentlyContinue | Select-Object -First 1
        $state = 'present'
        if (-not $jdk) {
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/i', 'C:\Windows\Temp\cr14\jdk-25_windows-x64_bin.msi',
            '/qn', '/norestart', '/l*v', 'C:\Windows\Temp\cr14\jdk-25-install.log')
          if ($p.ExitCode -notin 0, 3010) { throw "JDK installer exit code $($p.ExitCode)" }
          $jdk = Get-ChildItem 'C:\Program Files\Java' -Directory -Filter 'jdk-25*' | Select-Object -First 1
          $state = 'installed'
        }
        if (-not $jdk) { throw 'JDK 25 not found under C:\Program Files\Java' }
        [Environment]::SetEnvironmentVariable('JAVA_HOME', $jdk.FullName, 'Machine')
        "$state JAVA_HOME=$($jdk.FullName)"
      register: cr14_jdk
      changed_when: "'installed' in cr14_jdk.stdout"

    - name: Add %JAVA_HOME%\bin to the machine PATH
      ansible.windows.win_path:
        elements: '%JAVA_HOME%\bin'
        scope: machine
        state: present

    - name: Snyk CLI
      ansible.windows.win_get_url:
        url: "{{ cr14_snyk_url }}"
        dest: C:\Tools\bin\snyk.exe
        force: false
      register: cr14_snyk
      retries: 3
      delay: 20
      until: cr14_snyk is succeeded

    - name: Keep Defender away from the SQLMap checkout (it ships test payloads)
      ansible.windows.win_shell: Add-MpPreference -ExclusionPath 'C:\Tools\sqlmap'
      changed_when: false
      failed_when: false

    - name: SQLMap (clone of the official repository)
      ansible.windows.win_shell: |
        $env:GIT_TERMINAL_PROMPT = '0'; $env:GCM_INTERACTIVE = 'never'
        & 'C:\Program Files\Git\cmd\git.exe' clone --quiet --depth 1 {{ cr14_sqlmap_repo }} C:\Tools\sqlmap
        if ($LASTEXITCODE -ne 0) { throw "git clone failed with exit code $LASTEXITCODE" }
      args:
        creates: C:\Tools\sqlmap\sqlmap.py
      register: cr14_sqlmap
      retries: 3
      delay: 20
      until: cr14_sqlmap is succeeded

    - name: SQLMap command on the PATH
      ansible.windows.win_copy:
        dest: C:\Tools\bin\sqlmap.cmd
        content: "@echo off\r\npython \"C:\\Tools\\sqlmap\\sqlmap.py\" %*\r\n"

    - name: Postman (per-user installer, so it is installed as the trainee)
      chocolatey.chocolatey.win_chocolatey:
        name: postman
        state: present
      become: true
      become_method: ansible.builtin.runas
      become_user: "{{ cr14_trainee_user }}"
      vars:
        ansible_become_password: "{{ cr14_trainee_password }}"
      when: cr14_install_postman
      register: cr14_postman
      ignore_errors: true

    # --- networking between the three lab machines ---------------------------
    - name: Resolve the lab machines by name
      ansible.windows.win_shell: |
        $hosts = 'C:\Windows\System32\drivers\etc\hosts'
        $entries = [ordered]@{ 'sc1' = '{{ cr14_ip_sc1 }}'; 'sq1' = '{{ cr14_ip_sq1 }}'; 'owz1' = '{{ cr14_ip_owz1 }}' }
        $lines = @(Get-Content $hosts -ErrorAction SilentlyContinue | Where-Object {
          $_ -notmatch ('^\s*\S+\s+(' + (($entries.Keys) -join '|') + ')\s*$') })
        foreach ($name in $entries.Keys) { $lines += "$($entries[$name]) $name" }
        Set-Content -Path $hosts -Value $lines -Encoding ASCII
        Clear-DnsClientCache
      changed_when: false

    # localhost:9000 -> SQ1:9000 keeps the repository's scripts and lab guide
    # (which expect SonarQube on localhost) working unchanged.
    # sc1:8080 -> 127.0.0.1:8080 lets ZAP on OWZ1 reach the application while
    # the application itself stays bound to loopback; the firewall rule admits
    # that port from OWZ1 only.
    - name: Port forwarding for SonarQube and for the ZAP target, firewall rule
      ansible.windows.win_shell: |
        Set-Service iphlpsvc -StartupType Automatic
        Start-Service iphlpsvc
        netsh interface portproxy reset | Out-Null
        netsh interface portproxy add v4tov4 listenaddress=127.0.0.1 listenport=9000 connectaddress={{ cr14_ip_sq1 }} connectport=9000 | Out-Null
        netsh interface portproxy add v6tov4 listenaddress=::1 listenport=9000 connectaddress={{ cr14_ip_sq1 }} connectport=9000 | Out-Null
        netsh interface portproxy add v4tov4 listenaddress={{ cr14_ip_sc1 }} listenport=8080 connectaddress=127.0.0.1 connectport=8080 | Out-Null
        Get-NetFirewallRule -Name 'CR14-VulnShop-OWZ1' -ErrorAction SilentlyContinue | Remove-NetFirewallRule
        New-NetFirewallRule -Name 'CR14-VulnShop-OWZ1' -DisplayName 'CADMUS-CR-14 VulnShop 8080 - OWASP ZAP host only' `
          -Direction Inbound -Protocol TCP -LocalPort 8080 -RemoteAddress {{ cr14_ip_owz1 }} -Action Allow -Profile Any | Out-Null
        netsh interface portproxy show v4tov4
      register: cr14_portproxy
      changed_when: false

    # --- lab material ----------------------------------------------------------
    - name: Clone the application under test
      ansible.windows.win_shell: |
        $env:GIT_TERMINAL_PROMPT = '0'; $env:GCM_INTERACTIVE = 'never'
        & 'C:\Program Files\Git\cmd\git.exe' clone --quiet {{ cr14_app_repo }} '{{ cr14_app_dir }}'
        if ($LASTEXITCODE -ne 0) { throw "git clone failed with exit code $LASTEXITCODE" }
      args:
        creates: '{{ cr14_app_dir }}\pom.xml'
      register: cr14_clone
      retries: 3
      delay: 20
      until: cr14_clone is succeeded
      # A missing application must not take the whole workstation down with
      # it; the summary below and verify-cr-env.ps1 both report it.
      ignore_errors: true

    - name: Sandbox environment check script
      ansible.windows.win_template:
        src: verify-cr-env.ps1.j2
        dest: '{{ cr14_lab_dir }}\verify-cr-env.ps1'

    - name: Hand the lab folder to the trainee (git refuses repositories owned by another user)
      ansible.windows.win_shell: |
        icacls '{{ cr14_lab_dir }}' /setowner {{ cr14_trainee_user }} /T /C /Q | Out-Null
        icacls '{{ cr14_lab_dir }}' /grant '{{ cr14_trainee_user }}:(OI)(CI)F' /T /C /Q | Out-Null
        & 'C:\Program Files\Git\cmd\git.exe' config --system --replace-all safe.directory '*'
      changed_when: false

    - name: README on the desktop
      ansible.windows.win_template:
        src: sc1-README.txt.j2
        dest: C:\Users\Public\Desktop\CR-14 Sandbox README.txt

    - name: Shortcuts on the desktop
      ansible.windows.win_copy:
        dest: 'C:\Users\Public\Desktop\{{ item.name }}.url'
        content: "[InternetShortcut]\r\nURL={{ item.url }}\r\n"
      loop:
        - { name: "SonarQube (SQ1)", url: "http://localhost:9000/" }
        - { name: "OWASP ZAP (OWZ1)", url: "http://owz1:8080/zap/" }
        - { name: "VulnShop (after run-app)", url: "http://127.0.0.1:8080/shop" }

    - name: Lab folder shortcut on the desktop
      ansible.windows.win_shell: |
        $s = (New-Object -ComObject WScript.Shell).CreateShortcut('C:\Users\Public\Desktop\Lab folder.lnk')
        $s.TargetPath = '{{ cr14_lab_dir }}'
        $s.Save()
      args:
        creates: C:\Users\Public\Desktop\Lab folder.lnk

    - name: Remove the JDK installer
      ansible.windows.win_file:
        path: C:\Windows\Temp\cr14\jdk-25_windows-x64_bin.msi
        state: absent

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "{{ cr14_jdk.stdout | trim }}"
          - >-
            Postman: {{ 'skipped' if not cr14_install_postman
            else ('FAILED - install it manually as ' ~ cr14_trainee_user if cr14_postman is failed else 'installed') }}
          - "Application clone: {{ 'FAILED - check ' ~ cr14_app_repo if cr14_clone is failed else 'OK' }}"
          - "{{ cr14_portproxy.stdout_lines | default([]) }}"
